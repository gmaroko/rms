<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMS - Rooms</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#/">RMS</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#/">Home</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#/rooms">Rooms</a></li>
          <li class="nav-item"><a class="nav-link" href="#/book">Book</a></li>
          <li class="nav-item"><a class="nav-link" href="#/">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="py-5 text-center bg-white border-bottom">
    <div class="container">
      <h1 class="display-6 fw-bold">Available Rooms</h1>
      <p class="text-muted">Browse rooms and check what’s available</p>
    </div>
  </header>

  <main class="container py-5">
    <div class="row g-4">

      <div class="col-lg-8">
        <section>
          <h2 class="h5 mb-3">Room Listings</h2>

          <div id="room-list" class="row g-3">
            <div class="col-12">
              <div class="placeholder-glow">
                <div class="placeholder col-12 py-4"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <aside class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h3 class="h6 mb-3">Filters</h3>

            <form>
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input id="date" type="date" class="form-control">
              </div>

              <div class="mb-3">
                <label for="type" class="form-label">Room Type</label>
                <select id="type" class="form-select">
                  <option value="">Any</option>
                  <option>Single</option>
                  <option>Double</option>
                  <option>Dorm</option>
                </select>
              </div>
            </form>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="bg-primary text-white py-3 mt-5">
    <div class="container text-center">
      <small>&copy; 2025 Campus Room Management System</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/a11y.js"></script>
</body>
</html>
