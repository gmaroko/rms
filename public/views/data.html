<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Room Booking System" />
  <title>RMS - Rooms</title>

  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-7q5G8k3gR4x6c8R5vW+GdhsG5tJj0q2x3b6F7zL6k3Yb9qD4vZD5pH1c4tQ8J9eB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/theme.css" />
</head>

<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <nav aria-label="Main navigation" class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/">Campus Life</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#/">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#/rooms">Rooms</a></li>
            <li class="nav-item"><a class="nav-link" href="#/book">Book a Room</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-5">
    <h1 class="h3 mb-4">Available Rooms</h1>
    <section>
      <h2 class="h5">Room Listings</h2>
      <div id="room-list" class="mt-3">
        <div class="placeholder-glow">
          <span class="placeholder col-12"></span>
        </div>
      </div>
    </section>
  </main>

  <aside class="container mb-5">
    <div class="row">
      <div class="col-md-4 offset-md-8">
        <div class="card p-3">
          <h3 class="h6">Filters</h3>
          <form>
            <div class="mb-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" name="date" class="form-control">
            </div>
            <div class="mb-3">
              <label for="type" class="form-label">Room Type</label>
              <select id="type" name="type" class="form-select">
                <option>Single</option>
                <option>Double</option>
                <option>Dorm</option>
              </select>
            </div>
          </form>
        </div>
      </div>
    </div>
  </aside>

  <footer class="bg-white border-top py-4">
    <div class="container text-center small text-muted">&copy; 2025 Project Alpha</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-9NDLQq0C1D3kVt3y0W2YV+N2y3Qf8K0a7y1b6m3iN5j8fQ2Lh3sK5c8a1bT3w4y" crossorigin="anonymous"></script>

  <script src="../js/a11y.js"></script>
</body>

</html>
